<html lang="tr">
<head>

<style>
:root{--bg:#f7f7fb;--ink:#29263d;--muted:#77748b;--line:#ebe9f2;--p:#6c63ff;--m:#52c7b8;--pe:#ffb37a;--pk:#f48fb1}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#faf9ff,#f2fbf9,#fff8f1)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.top{height:72px;background:#ffffffee;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4vw}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:#eeebff;display:grid;place-items:center;font-size:24px}.brand b{display:block}.brand small{color:var(--muted)}.icons{display:flex;gap:8px}.ico,.back{background:#f0eff7;border-radius:12px;padding:10px 12px;color:#5d57d9}main{max-width:1200px;margin:auto;padding:28px 18px 90px}.hero{background:linear-gradient(135deg,#6c63ff,#9389ff 55%,#63d1c1);color:#fff;border-radius:30px;padding:30px;box-shadow:0 18px 45px #4e47701c}.hero h1{margin:0 0 8px;font-size:clamp(27px,4vw,42px)}.hero p{margin:0;max-width:780px;line-height:1.55;opacity:.92}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{background:#ffffff22;padding:8px 12px;border-radius:999px;font-size:12px}.title{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.title h2{margin:0}.title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;text-align:left;box-shadow:0 8px 22px #39334d0b;transition:.18s;min-height:150px}.card:hover{transform:translateY(-3px);box-shadow:0 16px 35px #39334d16}.badge{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:25px;margin-bottom:14px}.card h3{margin:0 0 5px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.count{display:inline-block;margin-top:11px;padding:5px 8px;background:#f1efff;color:#6259e8;border-radius:9px;font-size:11px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.quick div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.quick b{font-size:26px}.quick small{display:block;color:var(--muted)}.quick button{margin-top:11px;background:#29263d;color:#fff;border-radius:11px;padding:9px 12px;font-size:12px}.exercise{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:27px;padding:20px;box-shadow:0 12px 32px #39334d0c}.eh{display:flex;justify-content:space-between}.eh h1{margin:0;font-size:24px}.level{background:#fff3ce;padding:6px 9px;border-radius:999px;font-size:11px;height:max-content}.prompt{font-size:18px;line-height:1.55}.visual{min-height:300px;border-radius:24px;background:linear-gradient(135deg,#f4f0ff,#e9fbf7 55%,#fff6e9);display:grid;place-items:center;position:relative;overflow:hidden;padding:18px;box-sizing:border-box}.artbox{display:grid;place-items:center;position:relative;z-index:2}.art{width:min(220px,55vw);height:min(220px,55vw);object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 14px 14px #413a6622)}.visual .vlabel{bottom:14px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;align-items:center;justify-items:center;padding:22px}.gallery .art{width:105px;height:105px}.scene{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;padding:24px}.scene .art{width:125px;height:125px}.artFallback{font-size:82px;position:relative;z-index:1}.visual:before,.visual:after{content:"";position:absolute;border-radius:50%;background:#fff8;}.visual:before{width:150px;height:150px;left:-50px;bottom:-50px}.visual:after{width:100px;height:100px;right:-20px;top:-20px}.emoji{font-size:115px;position:relative;z-index:1;filter:drop-shadow(0 12px 10px #413a6622)}.vlabel{position:absolute;bottom:18px;z-index:1;background:#ffffffd9;padding:8px 13px;border-radius:999px;font-weight:700}.cues{margin-top:13px;background:#f1faf8;border:1px solid #d9f0eb;padding:13px;border-radius:17px}.cues b{font-size:12px}.cuewrap{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.cue{background:#fff;border:1px solid #d9eee9;padding:7px 9px;border-radius:10px;font-size:11px}.answer{width:100%;min-height:120px;border:2px solid #eeecf4;border-radius:15px;padding:12px;outline:0;resize:vertical}.answer:focus{border-color:#9b95ff}.opts{display:grid;gap:8px}.opt{padding:13px;border-radius:13px;text-align:left;background:#f7f6fb;border:1px solid #e8e6ef}.opt.sel{background:#eeecff;border-color:#6c63ff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.primary,.green,.gray,.red{padding:11px 14px;border-radius:13px;font-weight:700}.visual-next{margin-top:12px}.nextbtn{width:100%;padding:15px 16px;border-radius:15px;font-weight:800;font-size:15px;background:#29263d;color:#fff;box-shadow:0 8px 18px #29263d18}.nextbtn:hover{transform:translateY(-1px)}.nav-bottom{margin-top:14px}.nav-exercise{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 4px;padding:10px;background:#f7f6fb;border:2px solid #e7e4f2;border-radius:18px;position:relative;z-index:10}.nav-exercise button{display:block!important;visibility:visible!important;opacity:1!important;min-height:56px;position:relative;z-index:30;pointer-events:auto;touch-action:manipulation}.nav-exercise .prevbtn{background:#eceaf5!important;color:#39344b!important;border:2px solid #d9d5e8!important}.nav-exercise .nextbtn{background:linear-gradient(135deg,#5b51e6,#7b70ff)!important;color:#fff!important;border:2px solid #5148d8!important}.nav-label{grid-column:1/-1;text-align:center;font-size:12px;font-weight:800;color:#615b72;margin-bottom:-2px}.prevbtn{width:100%;padding:15px 16px;border-radius:15px;font-weight:800;font-size:15px;background:#f0eff6;color:#514c63;border:1px solid #e1dfea}.prevbtn:hover{transform:translateY(-1px)}.prevbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,#6c63ff,#8e84ff);color:#fff}.green{background:#e7f8f4;color:#257b70}.gray{background:#f0eff6;color:#5d5969}.red{background:#fff0f3;color:#b74367}.feed{display:none;margin-top:12px;padding:12px;border-radius:14px}.feed.show{display:block}.good{background:#e8faf3;color:#20725e}.warn{background:#fff5d8;color:#765b00}.bad{background:#fff0f3;color:#a33b5b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font-size:25px}.stat small{display:block;color:var(--muted)}.history{margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.hr{display:flex;justify-content:space-between;border-bottom:1px solid #f0eef4;padding:9px 0;font-size:12px}.bar{position:fixed;bottom:0;left:0;right:0;height:66px;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 4vw;z-index:6}.bar small{min-width:90px}.track{height:8px;background:#ecebf2;border-radius:9px;flex:1;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6c63ff,#52c7b8)}.modal{position:fixed;inset:0;background:#28233d66;display:grid;place-items:center;padding:15px;z-index:20}.modal.hide{display:none}.modalbox{background:#fff;border-radius:25px;padding:22px;width:min(680px,100%)}.modalbox input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0 12px}.note{font-size:12px;color:var(--muted);line-height:1.5}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.exercise{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:18px 12px 82px}.grid,.quick{grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px;min-height:135px}.hero{padding:23px;border-radius:24px}.bar{padding:8px 12px}.brand small{display:none}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="logo">🧠</div><div><b>Afazi Terapi</b><small>DKT çalışma alanı • v11</small></div></div><div class="icons"><button class="ico" id="upd">↻</button><button class="ico" id="set">⚙️</button></div></header>
<main id="app"></main>
<footer class="bar"><small id="score">Seans • 0/0</small><div class="track"><i id="track"></i></div><button class="gray" id="finish">Bitir</button></footer>
<div class="modal hide" id="modal"><div class="modalbox" id="mb"></div></div>
<script>
const M=[
["word","🧠","Sözcük Bulma","Semantik ipuçları ve sözcük erişimi","#eeeaff"],
["image","🖼️","Resim Adlandırma","Nesne adlandırma ve cueing","#e7f8f4"],
["action","🏃","Eylem Adlandırma","Eylemi bul, kim-ne-nerede ilişkisini kur","#fff0df"],
["sentence","🗣️","Cümle Kurma","Sözcükten cümleye geç","#ffe9f1"],
["category","🗂️","Kategori","Semantik ağ ve kategori üretimi","#edf4ff"],
["auditory","👂","İşitsel Anlama","Tek, iki ve üç aşamalı komutlar","#fff6d9"],
["reading","📖","Okuduğunu Anlama","Metin, soru ve seçeneklerle anlama","#eaf8ff"],
["narrative","🎬","Resimli Anlatım","Kim-ne-nerede-sonra çalışması","#f5ebff"]];
const ICON={"elma":"🍎","muz":"🍌","portakal":"🍊","çilek":"🍓","üzüm":"🍇","karpuz":"🍉","armut":"🍐","şeftali":"🍑","kiraz":"🍒","limon":"🍋","ananas":"🍍","mango":"🥭","domates":"🍅","havuç":"🥕","patates":"🥔","salatalık":"🥒","soğan":"🧅","biber":"🫑","mısır":"🌽","marul":"🥬","brokoli":"🥦","sarımsak":"🧄","ekmek":"🍞","peynir":"🧀","yumurta":"🥚","çorba":"🍲","yoğurt":"🥣","süt":"🥛","reçel":"🍯","bal":"🍯","pirinç":"🍚","makarna":"🍝","kek":"🍰","kurabiye":"🍪","çikolata":"🍫","dondurma":"🍦","bardak":"🥛","tabak":"🍽️","kaşık":"🥄","çatal":"🍴","bıçak":"🔪","tencere":"🍲","çaydanlık":"🫖","kupa":"☕","telefon":"📱","anahtar":"🔑","şemsiye":"☂️","saat":"⌚","gözlük":"👓","çanta":"👜","cüzdan":"👛","kalem":"✏️","kitap":"📖","gazete":"📰","televizyon":"📺","kumanda":"🎛️","masa":"🪑","sandalye":"🪑","yatak":"🛏️","koltuk":"🛋️","kapı":"🚪","pencere":"🪟","lamba":"💡","buzdolabı":"🧊","süpürge":"🧹","havlu":"🧻","sabun":"🧼","diş fırçası":"🪥","şampuan":"🧴","tarak":"💇","ayna":"🪞","araba":"🚗","otobüs":"🚌","bisiklet":"🚲","tren":"🚆","uçak":"✈️","gemi":"🚢","motosiklet":"🏍️","taksi":"🚕","ambulans":"🚑","doktor":"🧑‍⚕️","öğretmen":"🧑‍🏫","aşçı":"🧑‍🍳","polis":"👮","berber":"💇","çiftçi":"🧑‍🌾","dişçi":"🧑‍⚕️","mont":"🧥","gömlek":"👕","pantolon":"👖","ayakkabı":"👟","şapka":"🧢","çorap":"🧦","çiçek":"🌷","top":"⚽","ağaç":"🌳","gitar":"🎸","davul":"🥁","telefon şarjı":"🔌","çekiç":"🔨","hediye":"🎁","fotoğraf":"📷","kulaklık":"🎧","sepet":"🧺","bank":"🪑","kulak":"👂","yemek":"🍽️","içmek":"🥤","koşmak":"🏃","yürümek":"🚶","oturmak":"🪑","kalkmak":"🧍","uyumak":"😴","okumak":"📖","yazmak":"✍️","diş fırçalamak":"🪥","giyinmek":"👕","kapıyı açmak":"🚪","kapıyı kapatmak":"🚪","temizlemek":"🧽","süpürmek":"🧹","pişirmek":"🍲","doğramak":"🔪","doldurmak":"🫖","sulamak":"🌷","sürmek":"🚗","binmek":"🚌","inmek":"🚌","oynamak":"⚽","izlemek":"📺","dinlemek":"🎧","alışveriş yapmak":"🛒","ödemek":"💳","taşımak":"👜","açmak":"🪟","asmak":"🧺","kurmak":"🍽️","toplamak":"🍽️","karıştırmak":"🥣","vermek":"🎁","çekmek":"📷","kapatmak":"🪟","almak":"📚","koklamak":"🌷","yıkamak":"🧼","kahvaltı yapmak":"🍳","çalışmak":"🌱","dinlenmek":"🛋️","beklemek":"⏳","aramak":"🔎","yardım etmek":"🤝","koymak":"📥","dikmek":"🌱"};
const OPENMOJI="https://cdn.jsdelivr.net/npm/openmoji@17.0.0/color/svg/";
let C=null,S={items:[],i:0,ok:0,ans:0,module:"",client:localStorage.getItem("client")||"",start:0,sel:null};
const A=document.getElementById("app");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const sh=a=>a.sort(()=>Math.random()-.5);
async function load(force=false){let r=await fetch("content.json?x="+(force?Date.now():"1"),{cache:force?"no-store":"default"});if(!r.ok)throw 0;C=await r.json();localStorage.setItem("afaziContent",JSON.stringify(C));localStorage.setItem("afaziUpdate",new Date().toISOString())}
function cached(){try{C=JSON.parse(localStorage.getItem("afaziContent"))}catch{}}
function count(t){return C.exercises.filter(x=>x.type===t).length}
function status(){document.getElementById("score").textContent=(S.client||"Seans")+" • "+S.ok+"/"+S.ans;document.getElementById("track").style.width=(S.ans?S.ok/S.ans*100:0)+"%"}
function home(){
 A.innerHTML=`<section class=hero><h1>Bugün kelimeleri birlikte yakalayalım. ✨</h1><p>Afazi Terapi; sözcük erişimi, semantik ağ, eylem, cümle, anlama ve anlatım çalışmalarını tek yerde toplar.</p><div class=pills><span class=pill>📚 ${C.exercises.length} egzersiz</span><span class=pill>📱 Telefon & tablet</span><span class=pill>↻ Güncellenebilir</span></div></section>
 <div class=title><h2>Terapi modülleri</h2><span>İçerik merkeziyle büyütülebilir</span></div>
 <section class=grid>${M.map(m=>`<button class=card data-m=${m[0]}><div class=badge style="background:${m[4]}">${m[1]}</div><h3>${m[2]}</h3><p>${m[3]}</p><span class=count>${count(m[0])} egzersiz</span></button>`).join("")}</section>
 <div class=title><h2>Hızlı erişim</h2><span>Seansı kişiselleştir</span></div>
 <section class=quick><div><b>${C.exercises.length}</b><small>Toplam egzersiz</small><button id=mix>🎲 Karışık seans</button></div><div><b>${(JSON.parse(localStorage.getItem("hist")||"[]")).length}</b><small>Kaydedilmiş seans</small><button id=his>📊 İlerleme</button></div><div><b>↻</b><small>Yeni içerik kontrolü</small><button id=ref>İçeriği yenile</button></div></section>`;
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));mix.onclick=()=>start("mixed");his.onclick=dashboard;ref.onclick=()=>refresh();
 status()
}
function start(t){S={...S,i:0,ok:0,ans:0,module:t,start:Date.now(),sel:null};S.items=sh(t==="mixed"?[...C.exercises]:C.exercises.filter(x=>x.type===t));exercise()}
function emojiCode(e){return [...String(e)].map(ch=>ch.codePointAt(0).toString(16).toUpperCase()).join("-")}
function art(k,alt,cls="art"){let e=ICON[k]||k;if(!e)return "";let u=OPENMOJI+emojiCode(e)+".svg";return `<div class=artbox><img class="${cls}" src="${u}" alt="${esc(alt||k)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class=artFallback style="display:none">${esc(e)}</span></div>`}
function visual(x){
 if(x.gallery?.length){
   return `<div class="visual gallery">${x.gallery.map(k=>art(k,k.title?.()||k,"art")).join("")}<div class=vlabel>${esc(x.category||x.title)}</div></div>`
 }
 if(x.scene?.length){
   return `<div class="visual scene">${x.scene.map(k=>art(k,k,"art")).join("")}<div class=vlabel>Resimlere bakarak anlat.</div></div>`
 }
 if(!x.image)return "";
 return `<div class=visual>${art(x.image,x.answer||x.title)}<div class=vlabel>${esc(x.answer||x.title)}</div></div>`
}
function exercise(){
 let x=S.items[S.i];if(!x)return dashboard();let pct=Math.round(S.i/S.items.length*100);
 let ans=x.options?`<div class=opts>${x.options.map((o,i)=>`<button class=opt data-o=${i}>${esc(o)}</button>`).join("")}</div>`:`<textarea id=input class=answer placeholder="${x.type==="narrative"?"Danışanın anlatımını / gözlemini yaz...":"Yanıtı yaz veya sözlü yanıtı değerlendir..."}></textarea>`;
 A.innerHTML=`<div class=row><button class=back id=back>← Modüller</button><span style="color:#77748b;font-size:12px">${S.i+1}/${S.items.length} • ${pct}%</span></div><div class=exercise><section class=panel><div class=eh><h1>${esc(x.title)}</h1><span class=level>${"★".repeat(x.difficulty||1)}</span></div><p class=prompt>${esc(x.prompt)}</p>${visual(x)}<div class="nav-exercise"><div class="nav-label">Egzersizler arasında geçiş</div><button class="prevbtn" id="prevTop" type="button">← ÖNCEKİ</button><button class="nextbtn" id="nextTop" type="button">SONRAKİ →</button></div>${x.question?`<div class=cues><b>Soru</b><br>${esc(x.question)}</div>`:""}<div class=cues><b>💡 İpucu basamakları</b><div class=cuewrap>${(x.cues||[]).map(c=>`<button class=cue data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div></div></section><section class=panel><h3>Yanıt alanı</h3><p style="font-size:12px;color:#77748b">Terapist olarak yanıtı değerlendir; gerekirse ipucu kullan.</p>${ans}<div class=row><button class=primary id=ok>✓ Doğru</button><button class=green id=hint>💡 İpucu kullandı</button><button class=red id=no>↻ Tekrar</button></div><div id=feed class=feed></div></section></div><div class="nav-exercise nav-bottom"><button class="prevbtn" id="prevBottom" type="button">← ÖNCEKİ</button><button class="nextbtn" id="nextBottom" type="button">SONRAKİ →</button></div>`;
 const backBtn=document.getElementById("back");const okBtn=document.getElementById("ok");const noBtn=document.getElementById("no");const hintBtn=document.getElementById("hint");const prevBtn=document.getElementById("prevTop");const nextBtn=document.getElementById("nextTop");const prevBottom=document.getElementById("prevBottom");const nextBottom=document.getElementById("nextBottom");
if(backBtn)backBtn.addEventListener("click",home);document.querySelectorAll(".cue").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.c)));document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".opt").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");S.sel=x.options[+b.dataset.o]}));if(okBtn)okBtn.addEventListener("click",()=>record(1,"Harika! Doğru olarak kaydedildi.","good"));if(noBtn)noBtn.addEventListener("click",()=>record(0,"Bu maddeyi tekrar çalışabiliriz.","bad"));if(hintBtn)hintBtn.addEventListener("click",()=>feed("İpucu kullanıldı. Yanıtı ipucuyla değerlendir.","warn"));
const goNext=()=>{if(!S.items.length)return;if(S.i<S.items.length-1){S.i+=1;S.sel=null;exercise();window.scrollTo(0,0);}else{dashboard();}};
const goPrev=()=>{if(!S.items.length)return;if(S.i>0){S.i-=1;S.sel=null;exercise();window.scrollTo(0,0);}};
if(prevBtn)prevBtn.disabled=S.i===0;
if(prevBottom)prevBottom.disabled=S.i===0;
if(nextBtn)nextBtn.textContent=S.i===S.items.length-1?"Modülü Bitir ✓":"Sonraki →";
if(nextBottom)nextBottom.textContent=S.i===S.items.length-1?"Modülü Bitir ✓":"SONRAKİ →";
document.onclick=e=>{
  const b=e.target.closest("#prevTop,#prevBottom,#nextTop,#nextBottom");
  if(!b)return;
  e.preventDefault();
  e.stopPropagation();
  if(b.id==="prevTop"||b.id==="prevBottom")goPrev();
  else goNext();
};
status()
}
function feed(t,c){let f=document.getElementById("feed");if(f){f.textContent=t;f.className="feed show "+c}}
function record(ok,msg,c){S.ans++;if(ok)S.ok++;feed(msg,c);status()}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";speechSynthesis.speak(u)}}
function dashboard(){
 let h=JSON.parse(localStorage.getItem("hist")||"[]"),p=S.ans?Math.round(S.ok/S.ans*100):0;
 A.innerHTML=`<div class=row><button class=back id=dh>← Ana sayfa</button></div><section class=hero><h1>Seans özeti 🎯</h1><p>Bu oturumun hızlı özeti. Seansı kaydedebilir veya yeni bir seansa geçebilirsin.</p></section><div class=title><h2>Bu seans</h2></div><section class=stats><div class=stat><b>${S.ans}</b><small>Yanıtlanan</small></div><div class=stat><b>${S.ok}</b><small>Doğru</small></div><div class=stat><b>${p}%</b><small>Başarı</small></div><div class=stat><b>${Math.max(1,Math.round((Date.now()-S.start)/60000))} dk</b><small>Süre</small></div></section><div class=row><button class=primary id=save>💾 Seansı kaydet</button><button class=green id=news>＋ Yeni seans</button></div><div class=history><h3>Son seanslar</h3>${h.length?h.slice(-8).reverse().map(z=>`<div class=hr><span>${esc(z.client)} • ${new Date(z.date).toLocaleString("tr-TR")}</span><b>${z.ok}/${z.ans} • ${z.p}%</b></div>`).join(""):"<span style=color:#77748b>Henüz kayıt yok.</span>"}</div>`;
 dh.onclick=home;news.onclick=home;save.onclick=saveSession;status()
}
function saveSession(){let h=JSON.parse(localStorage.getItem("hist")||"[]"),p=S.ans?Math.round(S.ok/S.ans*100):0;h.push({date:new Date().toISOString(),client:S.client||"Danışan",ok:S.ok,ans:S.ans,p});localStorage.setItem("hist",JSON.stringify(h));alert("Seans kaydedildi.");dashboard()}
async function refresh(){try{await load(true);home();alert("İçerik yenilendi.")}catch(e){alert("İçerik yenilenemedi.")}}
function settings(){modal.classList.remove("hide");mb.innerHTML=`<h2>⚙️ Ayarlar</h2><label>Danışan adı</label><input id=client value="${esc(S.client)}" placeholder="Örn. Danışan A"><p class=note>Yeni egzersizleri sadece <b>www/content.json</b> dosyasını değiştirerek ekleyebilirsin. Görseller internetten OpenMoji’nin renkli SVG ikonlarıyla yüklenir; bağlantı yoksa emoji yedeği gösterilir.</p><p class=note>AI için ileride güvenli bir backend adresi eklenebilir. API anahtarını GitHub'a koyma.</p><p class=note>Görsel kaynağı: OpenMoji • CC BY-SA 4.0.</p><div class=row style=justify-content:flex-end><button class=gray id=close>Kapat</button><button class=primary id=saveSet>Kaydet</button></div>`;close.onclick=()=>modal.classList.add("hide");saveSet.onclick=()=>{S.client=client.value.trim();localStorage.setItem("client",S.client);modal.classList.add("hide");home()}}
set.onclick=settings;upd.onclick=refresh;finish.onclick=()=>S.ans?dashboard():home();modal.onclick=e=>{if(e.target===modal)modal.classList.add("hide")};
(async()=>{try{await load()}catch(e){cached()}if(!C)A.innerHTML="<div class=hero><h1>İçerik bulunamadı</h1><p>www/content.json dosyasını kontrol et.</p></div>";else home()})();
</script></body></html>
